<title>STUDIO LEGALE CAMPAGNOLI</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#1f4e8c;--border:#e0e0e5;--red:#d70015;--amber:#b25e00;--green:#248a3d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--accent:#4c8de0;--border:#2c2c2e;--red:#ff453a;--amber:#ffb340;--green:#30d158}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--accent:#4c8de0;--border:#2c2c2e;--red:#ff453a;--amber:#ffb340;--green:#30d158}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:22px;line-height:1.2;margin:6px 0 12px}
.brand{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.brand h1{margin:0}.brand .logo{height:52px;width:auto;flex:none;background:#fff;border-radius:10px;padding:4px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
nav button{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 0;font-size:13px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;font-size:16px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn.s{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--border)}
.item:first-child{border-top:0}
.item .b{flex:1;cursor:pointer;min-width:0}
.item .x{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.m{color:var(--muted);font-size:14px}
.past{opacity:.5}.over{color:var(--red)}.soon{color:var(--amber)}.done b{text-decoration:line-through;opacity:.6}
.res{font-size:20px;font-weight:700;margin:6px 0}
.note{font-size:13px;color:var(--muted);margin:4px 0}
.hide{display:none}
input[type=checkbox]{width:22px;height:22px;margin-top:2px}
.brand h1{flex:1}
.bell{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.ov{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:10;overflow:auto}
.ov.hide{display:none}
.pop{background:var(--card);color:var(--text);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:100%;overflow:auto}
.pop h2{margin:0 0 10px;font-size:20px}
.pop.red{background:var(--red);color:#fff}
.pi{padding:10px 0;border-top:1px solid rgba(128,128,128,.35)}
.m2{font-size:14px;opacity:.85}
.pb{margin-top:8px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.pok{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.pop.red .pok{background:#fff;color:var(--red)}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.wd{text-align:center;font-size:12px;color:var(--muted)}
.cell{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:9px;min-height:48px;padding:4px 0;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.cell.today{border-color:var(--accent);font-weight:700}
.cell.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.dots{display:flex;gap:2px;height:7px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.cell.sel .dot{outline:1px solid #fff}
.row2{display:flex;justify-content:space-between;align-items:center}
.cb{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:8px;padding:4px 14px;font-size:18px;cursor:pointer}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;align-items:center}
h1{font-weight:600;font-size:16px;letter-spacing:.04em}h1 .i{font-size:25px;letter-spacing:.02em}
</style>
</head>

  <div class="card"><strong>Backup dei dati</strong>
    <p class="m" id="b_info"></p>
    <p class="note">I dati restano solo su questo dispositivo: se cancelli i dati di Safari si perdono. Salva un backup regolarmente e conservalo in un posto sicuro (contiene dati dei clienti).</p>
    <button class="btn" id="b_exp">Esporta backup (file)</button>
    <button class="btn s" id="b_copy">Copia backup negli appunti</button>
  </div>
  <div class="card"><strong>Ripristina</strong>
    <label>Da file di backup</label><input type="file" id="b_file" accept=".json,application/json">
    <label>Oppure incolla il testo del backup</label><textarea id="b_txt" rows="4"></textarea>
    <button class="btn s" id="b_txt_btn">Ripristina da testo</button>
    <p class="note">Il ripristino sostituisce i dati attuali.</p>
  </div>
</section>
<section id="v-list" class="hide"></section>
</main>
<div id="modal" class="ov hide"><div id="pop" class="pop"></div></div>
<script>
var KEY="studio_v1",DB={pratiche:[],scadenze:[],appuntamenti:[],incombenze:[]},tab="pratiche",ed={},Q="",RES="";
try{var s0=localStorage.getItem(KEY);if(s0){var o=JSON.parse(s0);for(var k in DB)if(o[k])DB[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pd(s){return new Date(s+"T12:00:00")}
function fmt(s){return s?pd(s).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short",year:"numeric"}):""}
function eur(n){return Number(n||0).toLocaleString("it-IT",{style:"currency",currency:"EUR"})}
function addD(d,n){var r=new Date(d);r.setDate(r.getDate()+n);return r}
function addM(d,k){var t=new Date(d.getFullYear(),d.getMonth()+k,1,12),l=new Date(t.getFullYear(),t.getMonth()+1,0,12).getDate();t.setDate(Math.min(d.getDate(),l));return t}
function bkData(){return JSON.stringify({app:"studio-legale",versione:1,data:new Date().toISOString(),pratiche:DB.pratiche,scadenze:DB.scadenze,appuntamenti:DB.appuntamenti,incombenze:DB.incombenze},null,1)}
function bk(){var lb=null;try{lb=localStorage.getItem("studio_last_bk")}catch(e){}
  $("b_info").innerHTML=DB.pratiche.length+" pratiche · "+DB.scadenze.length+" scadenze · "+DB.appuntamenti.length+" appuntamenti · "+DB.incombenze.length+" incombenze<br>Ultimo backup: "+(lb?new Date(lb).toLocaleString("it-IT"):"mai")}
function mark(){try{localStorage.setItem("studio_last_bk",new Date().toISOString())}catch(e){}bk()}
function restore(txt){var o;try{o=JSON.parse(txt)}catch(e){alert("File non valido");return}
  if(!o||!Array.isArray(o.pratiche)||!Array.isArray(o.scadenze)||!Array.isArray(o.appuntamenti)){alert("Backup non riconosciuto");return}
  if(!confirm("Ripristinare il backup? I dati attuali verranno sostituiti ("+o.pratiche.length+" pratiche, "+o.scadenze.length+" scadenze, "+o.appuntamenti.length+" appuntamenti)."))return;
  DB.pratiche=o.pratiche;DB.scadenze=o.scadenze;DB.appuntamenti=o.appuntamenti;DB.incombenze=Array.isArray(o.incombenze)?o.incombenze:[];ed={};save();bk();alert("Backup ripristinato")}

var CFG={
 pratiche:{t:"Pratiche",f:[["nome","Nome"],["cognome","Cognome"],["oggetto","Oggetto della pratica"],["preventivo","Preventivo (€)","number"]],btn:"pratica"},
 scadenze:{t:"Scadenze",f:[["data","Data","date"],["titolo","Scadenza"],["nota","Pratica / nota"]],btn:"scadenza"},
 appuntamenti:{t:"Appuntamenti",f:[["data","Data","date"],["ora","Ora","time"],["titolo","Appuntamento"],["nota","Cliente / luogo"]],btn:"appuntamento"},
 incombenze:{t:"Incombenze",f:[["titolo","Incombenza (testo libero)"],["data","Scadenza (facoltativa)","date",1]],btn:"incombenza"}
};
function nav(){
  var h="";["cal","pratiche","scadenze","appuntamenti","incombenze","backup"].forEach(function(k){h+='<button data-tab="'+k+'" class="'+(k===tab?"on":"")+'">'+(k==="backup"?"Backup":(k==="cal"?"Calendario":CFG[k].t))+'</button>'});
  $("nav").innerHTML=h;
  $("v-backup").classList.toggle("hide",tab!=="backup");
  $("v-cal").classList.toggle("hide",tab!=="cal");
  $("v-list").classList.toggle("hide",tab==="backup"||tab==="cal");
}
function form(t){
  var c=CFG[t],cur=ed[t]?DB[t].filter(function(x){return x.id===ed[t]})[0]||{}:{},h='<div class="card"><strong>'+(ed[t]?"Modifica ":"Nuova ")+c.btn+'</strong>';
  var pair=(t==="appuntamenti")?2:0;
  c.f.forEach(function(f,i){
    var v=cur[f[0]]!=null?cur[f[0]]:(f[2]==="date"&&!f[3]?iso(new Date()):"");
    var inp='<label>'+f[1]+'</label><input id="f_'+f[0]+'" type="'+(f[2]||"text")+'" value="'+esc(v)+'"'+(f[2]==="number"?' inputmode="decimal" step="0.01"':"")+'>';
    if(pair&&i<2){h+=(i===0?'<div class="g2"><div>':'<div>')+inp+'</div>'+(i===1?'</div>':'')}
    else if(t==="pratiche"&&i<2){h+=(i===0?'<div class="g2"><div>':'<div>')+inp+'</div>'+(i===1?'</div>':'')}
    else h+=inp;
  });
  return h+'<button class="btn" data-act="save">'+(ed[t]?"Salva modifiche":"Aggiungi")+'</button>'+(ed[t]?'<button class="btn s" data-act="cancel">Annulla</button>':"")+'</div>';
}
function list(t){
  var a=DB[t].slice(),td=iso(new Date()),h="",lim=iso(addD(new Date(),7));
  if(t==="pratiche"){
    var q=Q.toLowerCase();
    a=a.filter(function(x){return (x.nome+" "+x.cognome+" "+x.oggetto).toLowerCase().indexOf(q)>-1}).sort(function(x,y){return (x.cognome||"").localeCompare(y.cognome||"")});
    var tot=a.reduce(function(s,x){return s+(parseFloat(x.preventivo)||0)},0);
    h='<input id="q" placeholder="Cerca pratica o cliente…" value="'+esc(Q)+'" style="margin-bottom:8px"><div class="m" style="margin-bottom:6px">'+a.length+' pratiche · Totale preventivi '+eur(tot)+'</div>';
    a.forEach(function(x){h+='<div class="item"><div class="b" data-act="edit" data-id="'+x.id+'"><b>'+esc(x.cognome)+' '+esc(x.nome)+'</b><div class="m">'+esc(x.oggetto)+'</div><div class="m">Preventivo: '+eur(x.preventivo)+'</div></div><button class="x" data-act="del" data-id="'+x.id+'">×</button></div>'});
  }else if(t==="scadenze"){
    a.sort(function(x,y){return (x.done?1:0)-(y.done?1:0)||x.data.localeCompare(y.data)});
    a.forEach(function(x){var cl=x.done?"done":(x.data<td?"over":(x.data<=lim?"soon":""));
      h+='<div class="item '+cl+'"><input type="checkbox" data-act="done" data-id="'+x.id+'"'+(x.done?" checked":"")+'><div class="b" data-act="edit" data-id="'+x.id+'"><b>'+esc(x.titolo)+'</b><div class="m '+cl+'">'+fmt(x.data)+(!x.done&&x.data<td?" · SCADUTA":"")+'</div>'+(x.nota?'<div class="m">'+esc(x.nota)+'</div>':"")+'</div>'+mb(x)+'<button class="x" data-act="del" data-id="'+x.id+'">×</button></div>'});
  }else if(t==="appuntamenti"){
    var key=function(x){return x.data+(x.ora||"")};
    var up=a.filter(function(x){return x.data>=td}).sort(function(x,y){return key(x).localeCompare(key(y))}),pa=a.filter(function(x){return x.data<td}).sort(function(x,y){return key(y).localeCompare(key(x))});
    up.concat(pa).forEach(function(x){h+='<div class="item '+(x.data<td?"past":"")+'"><div class="b" data-act="edit" data-id="'+x.id+'"><b>'+esc(x.titolo)+'</b><div class="m">'+fmt(x.data)+(x.ora?" · "+esc(x.ora):"")+'</div>'+(x.nota?'<div class="m">'+esc(x.nota)+'</div>':"")+'</div>'+mb(x)+'<button class="x" data-act="del" data-id="'+x.id+'">×</button></div>'});
  }else{
    a.sort(function(x,y){return (x.done?1:0)-(y.done?1:0)||(x.data?0:1)-(y.data?0:1)||(x.data||"").localeCompare(y.data||"")});
    a.forEach(function(x){var cl=x.done?"done":(x.data&&x.data<td?"over":(x.data&&x.data<=lim?"soon":""));
      h+='<div class="item '+cl+'"><input type="checkbox" data-act="done" data-id="'+x.id+'"'+(x.done?" checked":"")+'><div class="b" data-act="edit" data-id="'+x.id+'"><b>'+esc(x.titolo)+'</b>'+(x.data?'<div class="m '+cl+'">Scadenza: '+fmt(x.data)+(!x.done&&x.data<td?" · SCADUTA":"")+'</div>':"")+'</div>'+mb(x)+'<button class="x" data-act="del" data-id="'+x.id+'">×</button></div>'});
  }
  if(!DB[t].length)h+='<div class="m">Nessun elemento ancora.</div>';
  return '<div class="card">'+h+'</div>';
}
var cy=new Date().getFullYear(),cm=new Date().getMonth(),csel=iso(new Date());
function evs(day){var r=[];
  DB.scadenze.forEach(function(x){if(x.data===day)r.push({k:"scadenze",x:x,c:"var(--red)",l:"Scadenza"})});
  DB.appuntamenti.forEach(function(x){if(x.data===day)r.push({k:"appuntamenti",x:x,c:"var(--accent)",l:"Appuntamento"})});
  DB.incombenze.forEach(function(x){if(x.data===day)r.push({k:"incombenze",x:x,c:"var(--green)",l:"Incombenza"})});
  return r.sort(function(a,b){return (a.x.ora||"99").localeCompare(b.x.ora||"99")})}
function renderCal(){
  var first=new Date(cy,cm,1,12),st=(first.getDay()+6)%7,dim=new Date(cy,cm+1,0).getDate(),td=iso(new Date());
  var h='<div class="card"><div class="row2"><button class="cb" data-cn="-1">‹</button><strong style="text-transform:capitalize">'+first.toLocaleDateString("it-IT",{month:"long",year:"numeric"})+'</strong><button class="cb" data-cn="1">›</button></div><div class="cg">';
  ["L","M","M","G","V","S","D"].forEach(function(w){h+='<div class="wd">'+w+'</div>'});
  for(var i=0;i<st;i++)h+='<div></div>';
  for(var d=1;d<=dim;d++){var key=cy+"-"+pad(cm+1)+"-"+pad(d),e=evs(key);
    h+='<button class="cell'+(key===td?" today":"")+(key===csel?" sel":"")+'" data-cd="'+key+'"><span>'+d+'</span><span class="dots">'+e.slice(0,3).map(function(v){return '<i class="dot" style="background:'+v.c+'"></i>'}).join("")+'</span></button>'}
  h+='</div><div class="lg"><span><i class="dot" style="background:var(--red)"></i> Scadenze</span><span><i class="dot" style="background:var(--accent)"></i> Appuntamenti</span><span><i class="dot" style="background:var(--green)"></i> Incombenze</span><button class="cb" style="font-size:13px;padding:4px 10px;margin-left:auto" data-cn="0">Oggi</button></div></div>';
  var ev=evs(csel);
  h+='<div class="card"><strong style="text-transform:capitalize">'+fmt(csel)+'</strong>';
  if(!ev.length)h+='<div class="m" style="margin-top:8px">Nessun impegno in questa data.</div>';
  ev.forEach(function(v){var x=v.x;h+='<div class="item'+(x.done?" done":"")+'"><div class="b" data-go="'+v.k+'|'+x.id+'"><div class="m" style="color:'+v.c+'">'+v.l+(x.ora?" · ore "+esc(x.ora):"")+(x.done?" · fatta":"")+'</div><b>'+esc(x.titolo)+'</b>'+(x.nota?'<div class="m">'+esc(x.nota)+'</div>':"")+'</div></div>'});
  $("v-cal").innerHTML=h+'</div>';
}
var alertsOn=true,popOpen=false,AL=[];
try{alertsOn=localStorage.getItem("studio_alerts")!=="off"}catch(e){}
function bell(){$("bell").textContent=alertsOn?"🔔 Avvisi attivi":"🔕 Avvisi spenti"}
function dd(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function mb(x){return x.data?'<button class="x" data-act="mute" data-id="'+x.id+'" title="Avvisi">'+(x.mute?"🔕":"🔔")+'</button>':""}
function check(){
  if(!alertsOn||popOpen)return;
  var now=new Date(),td=iso(now),al=[];
  ["scadenze","incombenze"].forEach(function(k){DB[k].forEach(function(x){
    if(!x.data||x.done||x.mute||x.data<td)return;
    var d=dd(td,x.data),sh=x.sh||[],el=[15,7,3,1].filter(function(m){return d<=m&&sh.indexOf(m)<0});
    if(el.length)al.push({k:k,x:x,el:el,d:d,red:d<=1})})});
  DB.appuntamenti.forEach(function(x){
    if(!x.data||x.mute||x.sh||x.data<td)return;
    var t=pd(x.data);t.setDate(t.getDate()-2);t.setHours(12,0,0,0);
    if(now>=t)al.push({k:"appuntamenti",x:x,d:dd(td,x.data)})});
  if(al.length)show(al);
}
function show(al){
  popOpen=true;AL=al;var red=al.some(function(a){return a.red}),h='<h2>'+(red?"⚠️ ATTENZIONE":"🔔 Promemoria")+'</h2>';
  al.forEach(function(a){var x=a.x,w=a.d===0?"OGGI":(a.d===1?"domani":"tra "+a.d+" giorni"),l=a.k==="appuntamenti"?"Appuntamento":(a.k==="scadenze"?"Scadenza":"Incombenza");
    h+='<div class="pi"><b>'+l+': '+esc(x.titolo)+'</b><div>'+w+' · '+fmt(x.data)+(x.ora?" ore "+esc(x.ora):"")+'</div>'+(x.nota&&a.k!=="incombenze"?'<div class="m2">'+esc(x.nota)+'</div>':"")+'<button class="pb" data-pm="'+a.k+'|'+x.id+'">Non avvisarmi più</button></div>'});
  $("pop").className="pop"+(red?" red":"");$("pop").innerHTML=h+'<button class="pok" id="pok">OK</button>';$("modal").classList.remove("hide");
}
function closePop(){AL.forEach(function(a){if(a.k==="appuntamenti")a.x.sh=true;else a.x.sh=(a.x.sh||[]).concat(a.el)});save();AL=[];popOpen=false;$("modal").classList.add("hide");render()}

function render(){nav();if(tab==="backup")bk();else if(tab==="cal")renderCal();else $("v-list").innerHTML=form(tab)+list(tab)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

document.addEventListener("click",function(e){
  var t=e.target,tb=t.getAttribute("data-tab");
  if(tb){tab=tb;render();window.scrollTo(0,0);return}
  var act=t.getAttribute("data-act"),i=t.getAttribute("data-id");if(!act&&t.parentNode&&t.parentNode.getAttribute){var p=t.closest("[data-act]");if(p){act=p.getAttribute("data-act");i=p.getAttribute("data-id")}}
  if(!act)return;var L=DB[tab];
  if(act==="mute"){var rm=L.filter(function(x){return x.id===i})[0];if(rm){rm.mute=!rm.mute;save();render()}return}
  if(act==="save"){var o={},c=CFG[tab];c.f.forEach(function(f){o[f[0]]=$("f_"+f[0]).value.trim()});
    var ok=tab==="pratiche"?(o.nome||o.cognome):o.titolo;if(!ok){alert("Compila i campi principali");return}
    if(ed[tab]){var r=L.filter(function(x){return x.id===ed[tab]})[0];if(r.data!==o.data)delete r.sh;for(var k in o)r[k]=o[k]}else{o.id=id();L.push(o)}
    ed[tab]=null;save();render()}
  else if(act==="cancel"){ed[tab]=null;render()}
  else if(act==="edit"){ed[tab]=i;render();window.scrollTo(0,0)}
  else if(act==="del"){if(confirm("Eliminare?")){DB[tab]=L.filter(function(x){return x.id!==i});if(ed[tab]===i)ed[tab]=null;save();render()}}
  else if(act==="done"){var r2=L.filter(function(x){return x.id===i})[0];r2.done=t.checked;save();render()}
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){Q=e.target.value;var p=e.target.selectionStart;render();var q=$("q");q.focus();q.setSelectionRange(p,p)}
});
$("b_exp").onclick=function(){try{var b=new Blob([bkData()],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-studio-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove();mark()}catch(e){alert("Esportazione non riuscita: usa Copia negli appunti")}};
$("b_copy").onclick=function(){try{navigator.clipboard.writeText(bkData()).then(function(){mark();alert("Copiato. Incollalo in Note o in una mail a te stesso.")},function(){alert("Copia non riuscita: usa Esporta file")})}catch(e){alert("Copia non riuscita: usa Esporta file")}};
$("b_file").onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){restore(r.result)};r.readAsText(f);e.target.value=""};
$("b_txt_btn").onclick=function(){restore($("b_txt").value)};
render();bell();
$("v-cal").onclick=function(e){var t=e.target.closest("[data-cn],[data-cd],[data-go]");if(!t)return;
  var cn=t.getAttribute("data-cn"),cd=t.getAttribute("data-cd"),go=t.getAttribute("data-go");
  if(cn!==null){if(cn==="0"){var n=new Date();cy=n.getFullYear();cm=n.getMonth();csel=iso(n)}else{cm+=Number(cn);if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}}renderCal()}
  else if(cd){csel=cd;renderCal()}
  else if(go){var a=go.split("|");tab=a[0];ed[tab]=a[1];render();window.scrollTo(0,0)}};
$("bell").onclick=function(){alertsOn=!alertsOn;try{localStorage.setItem("studio_alerts",alertsOn?"on":"off")}catch(e){}bell();if(alertsOn)check()};
$("pop").onclick=function(e){var t=e.target,pm=t.getAttribute("data-pm");
  if(pm){var a=pm.split("|"),r=DB[a[0]].filter(function(x){return x.id===a[1]})[0];if(r){r.mute=true;save();t.textContent="Avvisi disattivati";t.disabled=true}}
  if(t.id==="pok")closePop()};
check();setInterval(check,60000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)check()});
</script>
</body>
</html>
